<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#f8f9fa" />
  <rect x="30" y="30" width="1140" height="690" rx="12" fill="#ffffff" stroke="#d0d7de" />
  <rect x="60" y="70" width="360" height="36" rx="6" fill="#0d6efd" />
  <text x="80" y="95" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">Swagger UI</text>
  <rect x="60" y="130" width="520" height="28" rx="6" fill="#e9ecef" />
  <text x="80" y="149" font-family="Arial, sans-serif" font-size="16" fill="#495057">GET /</text>
  <rect x="60" y="175" width="520" height="28" rx="6" fill="#e9ecef" />
  <text x="80" y="194" font-family="Arial, sans-serif" font-size="16" fill="#495057">GET /health</text>
  <rect x="60" y="220" width="520" height="28" rx="6" fill="#e9ecef" />
  <text x="80" y="239" font-family="Arial, sans-serif" font-size="16" fill="#495057">GET /tasks</text>
  <rect x="60" y="265" width="520" height="28" rx="6" fill="#e9ecef" />
  <text x="80" y="284" font-family="Arial, sans-serif" font-size="16" fill="#495057">POST /tasks</text>
  <rect x="60" y="310" width="520" height="28" rx="6" fill="#e9ecef" />
  <text x="80" y="329" font-family="Arial, sans-serif" font-size="16" fill="#495057">GET /tasks/{task_id}</text>
  <rect x="60" y="355" width="520" height="28" rx="6" fill="#e9ecef" />
  <text x="80" y="374" font-family="Arial, sans-serif" font-size="16" fill="#495057">PUT /tasks/{task_id}</text>
  <rect x="60" y="400" width="520" height="28" rx="6" fill="#e9ecef" />
  <text x="80" y="419" font-family="Arial, sans-serif" font-size="16" fill="#495057">DELETE /tasks/{task_id}</text>
  <rect x="620" y="130" width="500" height="260" rx="10" fill="#f8f9fa" stroke="#d0d7de" />
  <text x="650" y="165" font-family="Arial, sans-serif" font-size="20" fill="#212529">Schemas</text>
  <text x="650" y="205" font-family="Arial, sans-serif" font-size="16" fill="#495057">TaskCreate</text>
  <text x="650" y="235" font-family="Arial, sans-serif" font-size="16" fill="#495057">TaskUpdate</text>
  <text x="650" y="265" font-family="Arial, sans-serif" font-size="16" fill="#495057">ValidationError</text>
</svg>
